<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>오늘의 뉴스 · Blogger Manager</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#1f2937;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6}.wrap{max-width:1100px;margin:32px auto;padding:0 18px}nav,.controls,.actions{display:flex;gap:8px;flex-wrap:wrap}nav a,button,select,input{font:inherit;border:1px solid #dce2eb;border-radius:10px;padding:10px 14px;background:white;color:#344054}nav a{text-decoration:none;font-size:14px;font-weight:700}nav a.active,button.primary{background:#142033;color:white}h1{font-size:28px;margin-bottom:6px}.sub,.meta{color:#667085}.controls{margin:22px 0;align-items:center}input{flex:1;min-width:170px}button{cursor:pointer}button:disabled{opacity:.6;cursor:wait}#status{padding:14px 16px;background:white;border:1px solid #dce2eb;border-radius:12px;margin-bottom:18px}#cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{background:white;border:1px solid #e4e9f1;border-radius:16px;padding:22px;min-width:0}.card h2{font-size:19px;line-height:1.5;margin:12px 0 16px;overflow-wrap:anywhere}.card a{color:#1b4caa;text-decoration:none}.card a:hover{text-decoration:underline}.badge{background:#eaf0ff;color:#3456a1;padding:4px 9px;border-radius:999px;font-size:12px}.meta{font-size:12px}.actions{margin-top:16px;align-items:center}.actions a{font-weight:700;font-size:14px}.actions button{font-size:12px;padding:7px 10px}.empty{grid-column:1/-1;padding:36px;text-align:center;color:#667085}footer{font-size:12px;color:#667085;margin:24px 0 40px}#feedback{min-height:24px;color:#245c43}@media(max-width:680px){#cards{grid-template-columns:1fr}.wrap{margin-top:20px}nav a{flex:1;text-align:center}h1{font-size:25px}}
</style></head>
<body><main class="wrap">
<nav aria-label="관리자 페이지"><a href="./">콘텐츠 관리</a><a href="./stats.html">통계</a><a href="./write.html">주제 발굴</a><a class="active" href="./news.html">오늘의 뉴스</a></nav>
<h1>오늘의 뉴스 30</h1><p class="sub">한국과 해외의 최근 24시간 뉴스에서 오늘의 글감을 찾아보세요.</p>
<div class="controls"><button id="load" class="primary">오늘 뉴스 조회</button><label for="category">분야</label><select id="category"><option>전체</option><option>한국</option><option>해외</option><option>경제</option><option>기술·AI</option><option>문화</option><option>생활·건강</option></select><input id="search" type="search" aria-label="뉴스 제목 검색" placeholder="관심 키워드 검색"><button id="copyAll" disabled>목록 복사</button></div>
<div id="status" role="status" aria-live="polite">조회 버튼을 누르면 최신 수집본을 가져옵니다.</div><div id="feedback" role="status"></div><section id="cards" aria-label="뉴스 목록"></section>
<footer>무료 RSS 기반 · 약 4시간마다 수집 · 인기 순위가 아닌 분야별 최신 헤드라인입니다. 비슷한 제목은 중복을 줄이지만 같은 사건이 남을 수 있습니다. 기사 요약과 AI 추천은 제공하지 않습니다. 기사 본문은 뉴스 링크에서 확인하세요.</footer>
</main><script>
let snapshot=null;
const $=id=>document.getElementById(id);
const date=value=>new Date(value).toLocaleString('ko-KR',{timeZone:'Asia/Seoul',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
function visible(){return (snapshot?.items||[]).filter(x=>($('category').value==='전체'||x.category===$('category').value)&& (x.title+' '+x.source).toLowerCase().includes($('search').value.trim().toLowerCase()));}
function safeUrl(value){try{const u=new URL(value);return u.protocol==='https:'?u.href:'';}catch{return '';}}
function render(){
 const rows=visible();$('cards').replaceChildren();$('copyAll').disabled=!rows.length;
 if(!rows.length){const p=document.createElement('p');p.className='empty';p.textContent='조건에 맞는 뉴스가 없습니다.';$('cards').append(p);return;}
 rows.forEach((item,i)=>{const card=document.createElement('article');card.className='card';const tag=document.createElement('span');tag.className='badge';tag.textContent=item.category;const title=document.createElement('h2');title.textContent=item.title;const meta=document.createElement('div');meta.className='meta';meta.textContent=(item.source||'매체 미표시')+' · '+date(item.publishedAt)+' KST';const actions=document.createElement('div');actions.className='actions';const link=document.createElement('a');link.href=safeUrl(item.url)||'#';link.target='_blank';link.rel='noopener noreferrer';link.textContent='뉴스 보기 ↗';const copy=document.createElement('button');copy.textContent='복사';copy.onclick=()=>copyText(item.title+'\n'+item.source+' · '+date(item.publishedAt)+'\n'+item.url);actions.append(link,copy);card.append(tag,title,meta,actions);$('cards').append(card);});
}
async function copyText(text){try{await navigator.clipboard.writeText(text);$('feedback').textContent='복사했습니다.';}catch{$('feedback').textContent='복사가 차단되었습니다. 아래 텍스트를 선택해 복사하세요.';const area=document.createElement('textarea');area.value=text;area.style.width='100%';$('feedback').append(area);area.select();}}
async function load(){
 $('load').disabled=true;$('status').textContent='최신 뉴스 수집본을 불러오는 중입니다…';
 try{const response=await fetch('https://raw.githubusercontent.com/wiclab/blogger-manager/main/data/news.json?t='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error('뉴스 수집본이 아직 준비되지 않았습니다. 잠시 후 다시 조회해주세요.');const data=await response.json();if(!Array.isArray(data.items)||!data.generatedAt)throw Error('뉴스 데이터 형식을 확인하지 못했습니다.');snapshot=data;render();const old=Date.now()-new Date(data.generatedAt).getTime()>8*3600000;$('status').textContent=data.items.length+'개 · 수집 '+date(data.generatedAt)+' KST · 수집 시점 기준 최근 24시간'+(old?' · 오래된 수집본입니다. 자동 수집 상태를 확인해주세요.':'')+(data.failedCategories?.length?' · 일부 분야 수집 실패: '+data.failedCategories.join(', '):'');}
 catch(error){$('status').textContent=error.message+(snapshot?' 이전에 조회한 목록을 유지합니다.':'');}finally{$('load').disabled=false;}
}
$('load').onclick=load;$('category').onchange=()=>{if(snapshot)render();};$('search').oninput=()=>{if(snapshot)render();};$('copyAll').onclick=()=>copyText(visible().map((x,i)=>(i+1)+'. '+x.title+'\n'+x.source+' · '+date(x.publishedAt)+'\n'+x.url).join('\n\n'));
</script></body></html>
