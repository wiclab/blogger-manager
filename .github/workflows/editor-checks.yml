name: Blogger editor checks

on:
  pull_request:
    paths:
      - "editor.html"
      - "dashboard.html"
      - "index.html"
      - "seo.html"
      - "indexing.html"
      - "write.html"
      - "news.html"
      - "assets/manager-header.css"
      - "assets/cms-shell.css"
      - "assets/cms-shell.js"
      - "assets/editor-preview.js"
      - "tests/editor_preview_browser.cjs"
      - "tests/test_navigation.py"
      - "tests/test_cms_shell.py"
      - "docs/BLOGGER_EDITOR.md"
      - "tests/test_editor.py"
      - "tests/test_indexing.py"
      - "scripts/indexing.py"
      - ".github/workflows/editor-checks.yml"
  push:
    paths:
      - "editor.html"
      - "dashboard.html"
      - "index.html"
      - "seo.html"
      - "indexing.html"
      - "write.html"
      - "news.html"
      - "assets/manager-header.css"
      - "assets/cms-shell.css"
      - "assets/cms-shell.js"
      - "assets/editor-preview.js"
      - "tests/editor_preview_browser.cjs"
      - "tests/test_navigation.py"
      - "tests/test_cms_shell.py"
      - "docs/BLOGGER_EDITOR.md"
      - "tests/test_editor.py"
      - ".github/workflows/editor-checks.yml"

permissions:
  contents: read

jobs:
  editor-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Blogger editor and indexing regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Blogger embedded script syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('editor.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s+[^>]*)?>([\s\S]*?)</script>',text)
          for i,script in enumerate(scripts):
            Path(f'/tmp/editor-inline-{i}.js').write_text(script,encoding='utf-8')
          PY
          for script in /tmp/editor-inline-*.js; do node --check "$script"; done
      - name: CMS OAuth and admin session behavioral regression
        run: node tests/cms_auth_flow.cjs
      - name: CMS login reuse and consent regression
        run: node tests/cms_login_reuse.cjs
      - name: Install browser test runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Preview rendering and mobile regression (no Blogger credentials)
        run: node tests/editor_preview_browser.cjs
