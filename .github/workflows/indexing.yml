name: Byeolsemso indexing automation

on:
  pull_request:
    paths:
      - "scripts/indexing.py"
      - "scripts/indexing_safe.py"
      - "tests/test_indexing.py"
      - "tests/test_indexing_safe.py"
      - "indexing.html"
      - ".github/workflows/indexing.yml"
  workflow_dispatch:
  schedule:
    - cron: "37 */2 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/indexing.py"
      - "scripts/indexing_safe.py"
      - "tests/test_indexing.py"
      - "tests/test_indexing_safe.py"
      - ".github/workflows/indexing.yml"

permissions:
  contents: write

concurrency:
  group: byeolsemso-indexing-data
  cancel-in-progress: false

jobs:
  indexing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout revision under test
        uses: actions/checkout@v4
      - name: Check out protected indexing data branch
        uses: actions/checkout@v4
        with:
          ref: indexing-data
          path: indexing-data
          persist-credentials: true
      - name: Restore receipt state from data branch
        run: |
          set -euo pipefail
          test -s indexing-data/data/indexing-state.json
          mkdir -p data
          cp indexing-data/data/indexing-state.json data/indexing-state.json
          if [ -f indexing-data/data/indexing-dashboard.json ]; then
            cp indexing-data/data/indexing-dashboard.json data/indexing-dashboard.json
          fi
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python before running any external API steps
        run: python -m compileall -q scripts tests
      - name: Validate code without external API requests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Check saved indexing receipts without external API calls
        run: |
          python - <<'PY'
          from scripts.indexing import load_state
          state = load_state()
          print(f"Protected Bing receipts: {len(state['bing'])}")
          PY
      - name: Validate public indexing dashboard JavaScript and structure
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          page = Path("indexing.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s+[^>]*)?>([\s\S]*?)</script>", page)
          if len(scripts) != 1:
              raise SystemExit("Expected exactly one indexing dashboard script")
          Path("/tmp/byeolsemso-indexing-ui.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/byeolsemso-indexing-ui.js
      - name: Check Bing API configuration
        id: bing-config
        if: github.event_name != 'pull_request'
        env:
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
        run: |
          if [ -z "${BING_API_KEY:-}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::BING_API_KEY secret is not configured; no URLs submitted."
            echo "## Byeolsemso indexing" >> "$GITHUB_STEP_SUMMARY"
            echo "- Not started: BING_API_KEY repository secret is missing." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare protected Bing intent (no POST)
        id: prepare
        if: github.event_name != 'pull_request' && steps.bing-config.outputs.ready == 'true'
        env:
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
        run: python -m scripts.indexing_safe prepare
      - name: Commit reservation BEFORE Bing POST
        id: reserve
        if: github.event_name != 'pull_request' && steps.prepare.outcome == 'success'
        run: |
          set -euo pipefail
          test -s data/indexing-plan.json
          test -s data/indexing-state.json
          test -s data/indexing-dashboard.json
          cp data/indexing-state.json indexing-data/data/indexing-state.json
          cp data/indexing-dashboard.json indexing-data/data/indexing-dashboard.json
          if [ -s data/indexing-state.backup.json ]; then
            cp data/indexing-state.backup.json indexing-data/data/indexing-state.backup.json
          fi
          cd indexing-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/indexing-state.json data/indexing-dashboard.json
          if [ -s data/indexing-state.backup.json ]; then
            git add data/indexing-state.backup.json
          fi
          plan=$(python -c 'import json;print(json.load(open("../data/indexing-plan.json"))["action"])')
          if ! git diff --cached --quiet; then
            git commit -m "Persist Bing intent before outbound submission"
            pushed=0
            for attempt in 1 2 3; do
              if git push origin HEAD:indexing-data; then pushed=1; break; fi
              if [ "$attempt" -lt 3 ]; then sleep "$((attempt * 2))"; fi
            done
            if [ "$pushed" != 1 ]; then
              echo "::error::Reservation push failed: refusing Bing POST"
              exit 1
            fi
          elif [ "$plan" = "submit" ]; then
            echo "::error::Submission plan without durable new reservation"
            exit 1
          fi
          if [ "$plan" = "submit" ]; then
            local_head=$(git rev-parse HEAD)
            remote_head=$(git ls-remote origin refs/heads/indexing-data | cut -f1)
            if [ "$local_head" != "$remote_head" ]; then
              echo "::error::Reservation not confirmed on remote: refusing Bing POST"
              exit 1
            fi
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Submit only committed reservation to Bing (one POST)
        id: submit
        if: github.event_name != 'pull_request' && steps.reserve.outputs.ready == 'true'
        env:
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
          INDEXING_RESERVATION_COMMITTED: 'true'
        run: python -m scripts.indexing_safe submit
      - name: Store safe diagnostic report (7 days)
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: indexing-report-${{ github.run_id }}
          path: |
            data/indexing-report.json
            data/indexing-failure.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Persist acknowledged receipts (never replay Bing POST)
        if: github.event_name != 'pull_request' && steps.submit.outcome == 'success'
        run: |
          set -euo pipefail
          test -s data/indexing-state.json
          test -s data/indexing-dashboard.json
          cp data/indexing-state.json indexing-data/data/indexing-state.json
          cp data/indexing-dashboard.json indexing-data/data/indexing-dashboard.json
          test -s data/indexing-state.backup.json
          cp data/indexing-state.backup.json indexing-data/data/indexing-state.backup.json
          cd indexing-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/indexing-state.json data/indexing-state.backup.json data/indexing-dashboard.json
          if git diff --cached --quiet; then
            echo "::error::Confirmed Bing receipts not written: keeping remote hold"
            exit 1
          fi
          git commit -m "Record confirmed Bing batch and clear protected hold"
          for attempt in 1 2 3; do
            if git push origin HEAD:indexing-data; then
              echo "Confirmed receipts persisted"
              exit 0
            fi
            echo "::warning::Receipt push retry of the exact same commit ($attempt/3)"
            if [ "$attempt" -lt 3 ]; then sleep "$((attempt * 2))"; fi
          done
          echo "::error::Receipt push failed: durable remote hold remains; reconcile manually"
          exit 1
