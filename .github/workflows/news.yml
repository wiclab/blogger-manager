name: Collect daily news
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */4 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/news.py'
      - 'scripts/news_intelligence.py'
      - 'tests/test_news_intelligence.py'
      - '.github/workflows/news.yml'
permissions:
  contents: write
concurrency:
  group: collect-news
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test news collector
        run: python -m unittest discover -s tests -p 'test_news*.py' -v
      - name: Collect RSS headlines
        run: python scripts/news.py
      - name: Generate editorial leads and optional Telegram digest
        env:
          BLOGGER_API_KEY: ${{ secrets.BLOGGER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/news_intelligence.py
      - name: Save snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/news.json data/news-intelligence.json
          if [ -f data/news-alert-state.json ]; then git add data/news-alert-state.json; fi
          if git diff --cached --quiet; then
            echo 'News snapshot unchanged; nothing to publish'
            exit 0
          fi
          git commit -m 'Refresh daily news snapshot'
          # Other tests or generated files must not prevent the scheduled
          # snapshot from being rebased and pushed.
          if [ -n "$(git status --porcelain)" ]; then
            echo '::notice::Stashing unrelated workflow-generated changes before rebase'
            git status --short
            git stash push --include-untracked -m 'Temporary news workflow files'
          fi
          git pull --rebase origin main
          git push origin HEAD:main
          echo 'News snapshot published successfully'
