name: Collect daily news
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */4 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/news.py'
      - '.github/workflows/news.yml'
permissions:
  contents: write
concurrency:
  group: collect-news
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test news collector
        id: test
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Collect RSS headlines
        id: collect
        run: python scripts/news.py
      - name: Save snapshot
        id: save
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/news.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh daily news snapshot'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Report collection failure
        if: failure()
        env:
          TEST_OUTCOME: ${{ steps.test.outcome }}
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
          SAVE_OUTCOME: ${{ steps.save.outcome }}
        run: |
          {
            echo "## News collection failed"
            echo
            echo "- Test step: ${TEST_OUTCOME}"
            echo "- Collection step: ${COLLECT_OUTCOME}"
            echo "- Save step: ${SAVE_OUTCOME}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=News collection failed::Review the failed step and run summary for details."
