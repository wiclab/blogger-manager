name: Blogger Scan

on:
  # 필요할 때 수동 실행도 가능
  workflow_dispatch:

  # 1시간마다 자동 실행
  schedule:
    - cron: "17 * * * *"

  # 검사 프로그램을 수정하면 즉시 한 번 실행
  push:
    paths:
      - "scripts/scan.mjs"
      - ".github/workflows/scan.yml"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Scan Blogger
        env:
          BLOGGER_API_KEY: ${{ secrets.BLOGGER_API_KEY }}
        run: node scripts/scan.mjs

      - name: Save report
        run: |
          git config user.name "blogger-manager-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/report.json

          if git diff --cached --quiet; then
            echo "No report changes"
          else
            git commit -m "Update Blogger scan report"
            git push
          fi
