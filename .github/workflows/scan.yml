name: Blogger Scan

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Scan Blogger
        env:
          BLOGGER_API_KEY: ${{ secrets.BLOGGER_API_KEY }}
        run: node scripts/scan.mjs

      - name: Save report
        run: |
          git config user.name "blogger-manager-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/report.json

          if git diff --cached --quiet; then
            echo "No report changes"
          else
            git commit -m "Update Blogger scan report"
            git push
          fi
