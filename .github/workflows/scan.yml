name: Blogger Scan

on:
  # 필요할 때 수동 실행도 가능
  workflow_dispatch:

  # 1시간마다 자동 실행
  schedule:
    - cron: "17 * * * *"

  # 검사 프로그램을 수정하면 즉시 한 번 실행
  push:
    paths:
      - "scripts/scan.mjs"
      - ".github/workflows/scan.yml"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Scan Blogger
        env:
          BLOGGER_API_KEY: ${{ secrets.BLOGGER_API_KEY }}
        run: node scripts/scan.mjs

      - name: Publish report to Cloudflare
        env:
          REPORT_PUBLISH_SECRET: ${{ secrets.REPORT_PUBLISH_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${REPORT_PUBLISH_SECRET:-}" ]; then
            echo "REPORT_PUBLISH_SECRET is missing"
            exit 1
          fi

          curl             --fail-with-body             --show-error             --silent             -X POST             "https://blogger-manager-api.chldndlf91.workers.dev/report/publish"             -H "Authorization: Bearer ${REPORT_PUBLISH_SECRET}"             -H "Content-Type: application/json"             --data-binary @data/report.json

