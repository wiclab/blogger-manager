name: Byeolsemso AdSense preflight

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/adsense-audit/**"
      - ".github/workflows/adsense-audit.yml"

permissions:
  contents: read

jobs:
  readonly-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r tools/adsense-audit/requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tools/adsense-audit/tests -v
      - name: Scan public site
        run: python tools/adsense-audit/scan.py --out adsense-audit-output --delay 0.80
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: byeolsemso-adsense-preflight
          path: adsense-audit-output/
          if-no-files-found: warn
          retention-days: 14
