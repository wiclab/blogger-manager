name: Byeolsemso SEO pulse

on:
  workflow_dispatch:
  schedule:
    - cron: "47 2 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/seo_pulse.py"
      - "tests/test_seo_pulse.py"
      - "seo.html"
      - ".github/workflows/seo-pulse.yml"
  pull_request:
    paths:
      - "scripts/seo_pulse.py"
      - "tests/test_seo_pulse.py"
      - "seo.html"
      - ".github/workflows/seo-pulse.yml"

permissions:
  contents: write

concurrency:
  group: byeolsemso-seo-pulse
  cancel-in-progress: false

jobs:
  seo-pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run safe SEO regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Check SEO dashboard JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          page = Path("seo.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s+[^>]*)?>([\s\S]*?)</script>", page)
          if len(scripts) != 1 or not scripts[0].strip():
              raise SystemExit(f"Expected one non-empty inline script in seo.html; found {len(scripts)}")
          Path("/tmp/seo-pulse-inline.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/seo-pulse-inline.js
      - name: Check out isolated SEO data branch
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: seo-data
          path: seo-data
      - name: Restore SEO report and title cache
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          test -s seo-data/data/seo-pulse.json
          test -s seo-data/data/blog-post-titles.json
          cp seo-data/data/seo-pulse.json data/seo-pulse.json
          cp seo-data/data/blog-post-titles.json data/blog-post-titles.json
          python - <<'PY'
          import json
          from pathlib import Path
          for path in ("data/seo-pulse.json", "data/blog-post-titles.json"):
              data = json.loads(Path(path).read_text())
              if data.get("site") != "https://wic12.blogspot.com/":
                  raise SystemExit(f"SEO data for wrong site: {path}")
          PY
      - name: Gather Bing performance and review date-sensitive articles
        if: github.event_name != 'pull_request'
        env:
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
          BLOGGER_API_KEY: ${{ secrets.BLOGGER_API_KEY }}
        run: python scripts/seo_pulse.py
      - name: Commit public-safe SEO data to seo-data only
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          test -s data/seo-pulse.json
          test -s data/blog-post-titles.json
          cp data/seo-pulse.json seo-data/data/seo-pulse.json
          cp data/blog-post-titles.json seo-data/data/blog-post-titles.json
          cd seo-data
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/seo-pulse.json data/blog-post-titles.json
          if git diff --cached --quiet; then
            echo "No SEO data changes"
            exit 0
          fi
          git commit -m "Update isolated Byeolsemso SEO report and title cache"
          git push origin HEAD:seo-data
