name: Byeolsemso SEO pulse

on:
  workflow_dispatch:
  schedule:
    - cron: "47 2 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/seo_pulse.py"
      - "tests/test_seo_pulse.py"
      - ".github/workflows/seo-pulse.yml"
  pull_request:
    paths:
      - "scripts/seo_pulse.py"
      - "tests/test_seo_pulse.py"
      - ".github/workflows/seo-pulse.yml"

permissions:
  contents: write

concurrency:
  group: byeolsemso-seo-pulse
  cancel-in-progress: false

jobs:
  seo-pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run safe SEO regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Check SEO dashboard JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          page = Path("seo.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s+[^>]*)?>([\s\S]*?)</script>", page)
          if not scripts:
              raise SystemExit("seo.html has no script")
          Path("/tmp/seo-pulse-inline.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/seo-pulse-inline.js
      - name: Gather Bing performance and review date-sensitive articles
        if: github.event_name != 'pull_request'
        env:
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
          BLOGGER_API_KEY: ${{ secrets.BLOGGER_API_KEY }}
        run: python scripts/seo_pulse.py
      - name: Commit public-safe summary, never raw keyword details
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          if [ ! -f data/seo-pulse.json ]; then
            echo "::warning::SEO report not generated"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/seo-pulse.json
          if git diff --cached --quiet; then
            echo "No SEO pulse changes"
            exit 0
          fi
          git commit -m "Update Byeolsemso SEO pulse summary"
          git pull --rebase origin main
          git push origin HEAD:main
