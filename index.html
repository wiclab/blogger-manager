<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="robots"
    content="noindex,nofollow"
  >

  <title>Blogger Manager</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #f5f7fa;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --blue: #2563eb;
      --green: #15803d;
      --green-bg: #f0fdf4;
      --orange: #b45309;
      --orange-bg: #fff7ed;
      --red: #b91c1c;
      --red-bg: #fef2f2;
      --dark: #111827;
    }

    body {
      margin: 0;

      background: var(--bg);
      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans KR",
        sans-serif;
    }

    a {
      color: var(--blue);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    button {
      font-family: inherit;
    }

    /* =========================================
       로그인
    ========================================= */

    #loginScreen {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    .login-card {
      width: min(430px, 100%);

      background: white;

      border: 1px solid var(--border);
      border-radius: 22px;

      padding: 36px;

      text-align: center;

      box-shadow:
        0 12px 35px
        rgba(0, 0, 0, 0.07);
    }

    .login-logo {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .login-card h1 {
      margin: 0 0 8px;
      font-size: 27px;
    }

    .login-desc {
      margin: 0 0 28px;

      color: var(--muted);

      line-height: 1.6;
      font-size: 14px;
    }

    #googleButton {
      display: flex;
      justify-content: center;

      min-height: 44px;
    }

    #loginMessage {
      margin-top: 18px;

      min-height: 20px;

      font-size: 13px;
    }

    .login-error {
      color: var(--red);
      font-weight: 600;
    }

    .login-info {
      color: var(--muted);
    }

    .login-success {
      color: var(--green);
      font-weight: 600;
    }

    /* =========================================
       앱
    ========================================= */

    #app {
      display: none;
    }

    .wrap {
      width: min(
        1400px,
        calc(100% - 32px)
      );

      margin: 34px auto 70px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;

      gap: 20px;

      margin-bottom: 8px;
    }

    .title-area h1 {
      margin: 0 0 5px;
      font-size: 29px;
    }

    .sub {
      margin: 0;

      color: var(--muted);
      font-size: 14px;
    }

    /* =========================================
       관리자
    ========================================= */

    .user-box {
      display: flex;
      align-items: center;

      gap: 10px;

      background: white;

      border: 1px solid var(--border);
      border-radius: 14px;

      padding: 8px 10px;
    }

    .user-photo {
      width: 34px;
      height: 34px;

      object-fit: cover;

      border-radius: 50%;

      background: #e5e7eb;
    }

    .user-data {
      line-height: 1.25;
    }

    .user-name {
      font-size: 12px;
      font-weight: 700;
    }

    .admin-state {
      font-size: 10px;
      color: var(--green);
    }

    .logout-button {
      border: 1px solid var(--border);

      background: white;
      color: #4b5563;

      border-radius: 8px;

      padding: 6px 8px;

      font-size: 11px;

      cursor: pointer;
    }

    .logout-button:hover {
      background: #f3f4f6;
    }

    /* =========================================
       검사 정보
    ========================================= */

    #updated,
    #method {
      color: var(--muted);
      font-size: 12px;
    }

    #updated {
      margin-top: 15px;
    }

    #method {
      margin-top: 7px;

      max-width: 1150px;

      line-height: 1.55;
    }

    /* =========================================
       Blogger 연결 박스
    ========================================= */

    .blogger-auth-panel {
      margin-top: 20px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 16px;

      background: white;

      border: 1px solid var(--border);
      border-radius: 16px;

      padding: 16px 18px;

      box-shadow:
        0 3px 12px
        rgba(0, 0, 0, 0.025);
    }

    .blogger-auth-left {
      min-width: 0;
    }

    .blogger-auth-title {
      margin-bottom: 4px;

      font-size: 14px;
      font-weight: 800;
    }

    #bloggerStatusText {
      color: var(--muted);

      font-size: 12px;
      line-height: 1.5;
    }

    .blogger-auth-actions {
      display: flex;
      flex-wrap: wrap;

      gap: 8px;
    }

    .action-button {
      border: 1px solid var(--border);

      border-radius: 10px;

      padding: 9px 12px;

      background: white;

      color: var(--text);

      font-size: 12px;
      font-weight: 700;

      cursor: pointer;
    }

    .action-button:hover {
      background: #f9fafb;
    }

    .action-button.primary {
      background: var(--dark);
      border-color: var(--dark);

      color: white;
    }

    .action-button.primary:hover {
      opacity: 0.9;
    }

    .action-button.danger {
      color: var(--red);

      border-color: #fecaca;

      background: white;
    }

    .action-button:disabled {
      cursor: not-allowed;

      opacity: 0.5;
    }

    .status-pill {
      display: inline-block;

      margin-right: 5px;

      padding: 3px 7px;

      border-radius: 999px;

      font-size: 10px;
      font-weight: 800;
    }

    .status-pill.connected {
      background: var(--green-bg);
      color: var(--green);
    }

    .status-pill.disconnected {
      background: var(--orange-bg);
      color: var(--orange);
    }

    .status-pill.error {
      background: var(--red-bg);
      color: var(--red);
    }

    /* =========================================
       블로그 카드
    ========================================= */

    .blogs {
      display: grid;

      grid-template-columns:
        repeat(
          auto-fit,
          minmax(300px, 1fr)
        );

      gap: 16px;

      margin: 26px 0;
    }

    .card {
      background: white;

      border: 1px solid var(--border);
      border-radius: 17px;

      padding: 20px;

      box-shadow:
        0 3px 12px
        rgba(0, 0, 0, 0.035);
    }

    .card h2 {
      margin: 0 0 10px;
    }

    .numbers {
      display: flex;
      flex-wrap: wrap;

      gap: 25px;

      margin-top: 18px;
    }

    .number strong {
      display: block;
      font-size: 25px;
    }

    .number span {
      color: var(--muted);
      font-size: 11px;
    }

    /* =========================================
       튜닝
    ========================================= */

    .tuning-info {
      margin-top: 17px;

      padding-top: 14px;

      border-top: 1px solid #eee;

      color: var(--muted);

      font-size: 12px;
      line-height: 1.75;
    }

    .tuning-info strong {
      color: #374151;
    }

    .common-label {
      display: inline-block;

      margin: 3px 3px 0 0;

      padding: 2px 6px;

      border-radius: 999px;

      background: #f3f4f6;
      color: #4b5563;

      font-size: 10px;
    }

    /* =========================================
       필터
    ========================================= */

    .controls {
      display: flex;
      flex-wrap: wrap;

      gap: 8px;

      margin: 22px 0 10px;
    }

    .controls button {
      border: 1px solid #d1d5db;

      background: white;
      color: var(--text);

      border-radius: 10px;

      padding: 9px 12px;

      font-size: 12px;
      font-weight: 600;

      cursor: pointer;
    }

    .controls button:hover,
    .controls button.active {
      background: var(--dark);
      color: white;
      border-color: var(--dark);
    }

    #countLine {
      margin: 0 0 10px;

      color: var(--muted);
      font-size: 12px;
    }

    /* =========================================
       표
    ========================================= */

    .table-wrap {
      overflow-x: auto;

      background: white;

      border: 1px solid var(--border);
      border-radius: 15px;
    }

    table {
      width: 100%;
      min-width: 1280px;

      border-collapse: collapse;
    }

    th,
    td {
      padding: 11px 12px;

      text-align: left;
      vertical-align: top;

      border-bottom: 1px solid #eee;
    }

    th {
      background: #f9fafb;

      font-size: 11px;

      white-space: nowrap;
    }

    td {
      font-size: 12px;
    }

    tbody tr:hover td {
      background: #fcfcfd;
    }

    .post-title {
      font-weight: 600;
      line-height: 1.45;
    }

    .ok {
      color: var(--green);
      font-weight: 700;
    }

    .warn {
      color: var(--orange);
      font-weight: 700;
    }

    .danger {
      color: var(--red);
      font-weight: 700;
    }

    .badge {
      display: inline-block;

      margin: 2px;

      padding: 3px 7px;

      border-radius: 999px;

      background: #fff7ed;
      color: #9a3412;

      font-size: 10px;

      white-space: nowrap;
    }

    .badge.isolated {
      background: #fef2f2;
      color: var(--red);
    }

    .badge.missing-title {
      background: #fff1f2;
      color: #be123c;
    }

    .recommendations {
      min-width: 290px;
      max-width: 380px;
    }

    .recommendation {
      display: block;

      margin-bottom: 8px;

      line-height: 1.35;
    }

    .recommendation:last-child {
      margin-bottom: 0;
    }

    .score {
      margin-left: 3px;

      color: #9ca3af;
      font-size: 9px;
    }

    .reason {
      display: block;

      margin-top: 2px;

      color: #9ca3af;
      font-size: 9px;
    }

    .muted {
      color: #9ca3af;
    }

    @media (max-width: 750px) {
      .wrap {
        width: calc(100% - 20px);

        margin: 22px auto 50px;
      }

      .topbar {
        display: block;
      }

      .user-box {
        margin-top: 16px;
        width: fit-content;
      }

      .blogger-auth-panel {
        align-items: flex-start;
        flex-direction: column;
      }

      .title-area h1 {
        font-size: 25px;
      }

      .card {
        padding: 16px;
      }

      .login-card {
        padding: 28px 20px;
      }
    }
  </style>
</head>

<body>

<!-- =========================================
     로그인
========================================= -->

<section id="loginScreen">

  <div class="login-card">

    <div class="login-logo">
      📊
    </div>

    <h1>
      Blogger Manager
    </h1>

    <p class="login-desc">
      별다알 + Nobody Asked Data<br>
      관리자 로그인이 필요합니다.
    </p>

    <div id="googleButton"></div>

    <div
      id="loginMessage"
      class="login-info"
    >
      Google 계정으로 인증해주세요.
    </div>

  </div>

</section>


<!-- =========================================
     앱
========================================= -->

<main id="app">

  <div class="wrap">

    <div class="topbar">

      <div class="title-area">

        <h1>
          📊 Blogger Manager
        </h1>

        <p class="sub">
          별다알 + Nobody Asked Data 통합 점검
        </p>

      </div>

      <div class="user-box">

        <img
          id="userPhoto"
          class="user-photo"
          alt=""
        >

        <div class="user-data">

          <div
            id="userName"
            class="user-name"
          >
            관리자
          </div>

          <div class="admin-state">
            Cloudflare 서버 인증됨 ✓
          </div>

        </div>

        <button
          class="logout-button"
          type="button"
          onclick="logout()"
        >
          로그아웃
        </button>

      </div>

    </div>


    <div id="updated"></div>

    <div id="method"></div>


    <!-- =====================================
         Blogger OAuth
    ====================================== -->

    <div class="blogger-auth-panel">

      <div class="blogger-auth-left">

        <div class="blogger-auth-title">
          🔐 Blogger 수정 권한
        </div>

        <div id="bloggerStatusText">
          연결 상태 확인 중...
        </div>

      </div>

      <div class="blogger-auth-actions">

        <button
          id="bloggerConnectButton"
          class="action-button primary"
          type="button"
          onclick="connectBlogger()"
        >
          🔐 Blogger 권한 연결
        </button>

        <button
          id="bloggerRefreshButton"
          class="action-button"
          type="button"
          onclick="checkBloggerStatus()"
        >
          ↻ 상태 확인
        </button>

        <button
          id="bloggerDisconnectButton"
          class="action-button danger"
          type="button"
          onclick="disconnectBlogger()"
          style="display:none"
        >
          연결 해제
        </button>

      </div>

    </div>


    <div
      id="blogs"
      class="blogs"
    ></div>


    <div
      id="controls"
      class="controls"
    >

      <button
        class="active"
        data-filter="all"
        onclick="setFilter('all')"
      >
        전체 글
      </button>

      <button
        data-filter="warning"
        onclick="setFilter('warning')"
      >
        ⚠ 경고 글
      </button>

      <button
        data-filter="isolated"
        onclick="setFilter('isolated')"
      >
        🏝 고립 글
      </button>

      <button
        data-filter="internal"
        onclick="setFilter('internal')"
      >
        나가는 내부링크 0
      </button>

      <button
        data-filter="recommended"
        onclick="setFilter('recommended')"
      >
        🔗 추천 있음
      </button>

      <button
        data-filter="short"
        onclick="setFilter('short')"
      >
        본문 짧음
      </button>

      <button
        data-filter="h2"
        onclick="setFilter('h2')"
      >
        H2 없음
      </button>

    </div>

    <p id="countLine"></p>


    <div class="table-wrap">

      <table>

        <thead>

          <tr>
            <th>블로그</th>
            <th>글 제목</th>
            <th>글자수</th>
            <th>나가는 링크</th>
            <th>받는 링크</th>
            <th>외부링크</th>
            <th>이미지</th>
            <th>H2</th>
            <th>점검</th>
            <th>내부링크 추천</th>
          </tr>

        </thead>

        <tbody id="posts"></tbody>

      </table>

    </div>

  </div>

</main>


<script
  src="https://accounts.google.com/gsi/client"
  async
  defer
></script>


<script>

/* =========================================
   설정
========================================= */

const GOOGLE_CLIENT_ID =
  "745983224346-2bir36jrfv79g8igk46aocv49o44u50f.apps.googleusercontent.com";


const API_BASE =
  "https://blogger-manager-api.chldndlf91.workers.dev";


const API_ORIGIN =
  "https://blogger-manager-api.chldndlf91.workers.dev";


/* =========================================
   상태
========================================= */

let REPORT = null;

let FILTER = "all";

let BLOGGER_CONNECTED = false;


/* =========================================
   ID Token
========================================= */

function getIdToken() {

  return sessionStorage.getItem(
    "bloggerManagerIdToken"
  ) || "";

}


/* =========================================
   관리자 API 호출
========================================= */

async function adminApi(
  path,
  options = {}
) {

  const idToken =
    getIdToken();


  if (!idToken) {

    throw new Error(
      "Google 관리자 로그인 토큰이 없습니다."
    );

  }


  const headers =
    new Headers(
      options.headers ||
      {}
    );


  headers.set(
    "Authorization",
    `Bearer ${idToken}`
  );


  if (
    options.body &&
    !headers.has(
      "Content-Type"
    )
  ) {

    headers.set(
      "Content-Type",
      "application/json"
    );

  }


  const response =
    await fetch(
      API_BASE + path,
      {
        ...options,
        headers
      }
    );


  let data = {};


  try {

    data =
      await response.json();

  } catch {}


  if (!response.ok) {

    const code =
      data.error ||
      "api_failed";


    if (
      code === "invalid_token" ||
      code === "missing_token"
    ) {

      sessionStorage.removeItem(
        "bloggerManagerIdToken"
      );

    }


    throw new Error(
      code
    );

  }


  return data;
}


/* =========================================
   Cloudflare에서 관리자 확인
========================================= */

async function verifyWithServer(
  idToken
) {

  const response =
    await fetch(
      API_BASE +
      "/auth/check",

      {
        method: "POST",

        headers: {
          Authorization:
            `Bearer ${idToken}`,

          "Content-Type":
            "application/json"
        }
      }
    );


  let data = {};


  try {

    data =
      await response.json();

  } catch {}


  if (
    !response.ok ||
    !data.ok ||
    !data.admin
  ) {

    const code =
      data.error ||
      "auth_failed";


    if (
      code === "not_admin"
    ) {

      throw new Error(
        "이 Google 계정은 관리자 권한이 없습니다."
      );

    }


    if (
      code === "invalid_token"
    ) {

      throw new Error(
        "Google 로그인 인증이 유효하지 않거나 만료되었습니다."
      );

    }


    if (
      code === "server_not_configured"
    ) {

      throw new Error(
        "Cloudflare 인증 서버 설정이 완료되지 않았습니다."
      );

    }


    throw new Error(
      `관리자 인증 실패: ${code}`
    );

  }


  return data;
}


/* =========================================
   Google Login
========================================= */

async function handleCredentialResponse(
  response
) {

  const message =
    document.getElementById(
      "loginMessage"
    );


  try {

    message.className =
      "login-info";

    message.textContent =
      "Cloudflare 서버에서 관리자 권한 확인 중...";


    const idToken =
      String(
        response.credential ||
        ""
      );


    if (!idToken) {

      throw new Error(
        "Google 로그인 토큰을 받지 못했습니다."
      );

    }


    const admin =
      await verifyWithServer(
        idToken
      );


    sessionStorage.setItem(
      "bloggerManagerIdToken",
      idToken
    );


    message.className =
      "login-success";

    message.textContent =
      "관리자 인증 완료";


    await showApp(
      admin
    );


  } catch (error) {

    console.error(
      error
    );


    sessionStorage.removeItem(
      "bloggerManagerIdToken"
    );


    message.className =
      "login-error";


    message.textContent =
      error.message ||
      "로그인에 실패했습니다.";

  }

}


/* =========================================
   세션 복구
========================================= */

async function restoreSession() {

  const idToken =
    getIdToken();


  if (!idToken) {

    return false;

  }


  try {

    const admin =
      await verifyWithServer(
        idToken
      );


    await showApp(
      admin
    );


    return true;


  } catch (error) {

    console.warn(
      error
    );


    sessionStorage.removeItem(
      "bloggerManagerIdToken"
    );


    return false;

  }

}


/* =========================================
   Google 버튼
========================================= */

function initGoogleLogin() {

  if (
    !window.google ||
    !google.accounts ||
    !google.accounts.id
  ) {

    setTimeout(
      initGoogleLogin,
      200
    );


    return;

  }


  google.accounts.id.initialize({

    client_id:
      GOOGLE_CLIENT_ID,

    callback:
      handleCredentialResponse,

    auto_select:
      false,

    cancel_on_tap_outside:
      false

  });


  const container =
    document.getElementById(
      "googleButton"
    );


  container.innerHTML =
    "";


  google.accounts.id.renderButton(

    container,

    {
      theme:
        "outline",

      size:
        "large",

      shape:
        "pill",

      text:
        "signin_with",

      width:
        280
    }

  );

}


/* =========================================
   앱 표시
========================================= */

async function showApp(
  admin
) {

  document
    .getElementById(
      "loginScreen"
    )
    .style.display =
      "none";


  document
    .getElementById(
      "app"
    )
    .style.display =
      "block";


  document
    .getElementById(
      "userName"
    )
    .textContent =
      admin.name ||
      "관리자";


  const photo =
    document.getElementById(
      "userPhoto"
    );


  if (
    admin.picture
  ) {

    photo.src =
      admin.picture;

    photo.style.display =
      "block";

  } else {

    photo.style.display =
      "none";

  }


  /*
   * Blogger 권한 확인
   */
  checkBloggerStatus();


  /*
   * 리포트
   */
  if (!REPORT) {

    try {

      await loadReport();

    } catch (error) {

      console.error(
        error
      );


      document
        .getElementById(
          "method"
        )
        .textContent =
          "리포트를 불러오지 못했습니다: " +
          error.message;

    }

  }

}


/* =========================================

/* =========================================
   Blogger 상태
========================================= */

async function checkBloggerStatus() {

  const status =
    document.getElementById(
      "bloggerStatusText"
    );


  const connectButton =
    document.getElementById(
      "bloggerConnectButton"
    );


  const disconnectButton =
    document.getElementById(
      "bloggerDisconnectButton"
    );


  status.innerHTML =
    `<span class="status-pill disconnected">확인 중</span>
     Blogger API 연결 상태 확인 중...`;


  try {

    const data =
      await adminApi(
        "/oauth/blogger/status"
      );


    if (
      data.connected
    ) {

      BLOGGER_CONNECTED =
        true;


      const displayName =
        data.bloggerUser?.displayName
          ? escapeHtml(
              data.bloggerUser.displayName
            )
          : "Blogger 계정";


      status.innerHTML =
        `<span class="status-pill connected">연결됨</span>
         ${displayName} · Blogger API 수정 권한 사용 가능`;


      connectButton.style.display =
        "none";


      disconnectButton.style.display =
        "inline-block";


      return true;

    }


    BLOGGER_CONNECTED =
      false;


    status.innerHTML =
      `<span class="status-pill disconnected">미연결</span>
       Blogger 수정 권한을 연결해주세요.`;


    connectButton.style.display =
      "inline-block";


    disconnectButton.style.display =
      "none";


    return false;


  } catch (error) {

    console.error(
      error
    );


    BLOGGER_CONNECTED =
      false;


    status.innerHTML =
      `<span class="status-pill error">오류</span>
       연결 상태 확인 실패: ${escapeHtml(
         error.message
       )}`;


    connectButton.style.display =
      "inline-block";


    disconnectButton.style.display =
      "none";


    return false;

  }

}


/* =========================================
   Blogger 연결 시작
========================================= */

async function connectBlogger() {

  const button =
    document.getElementById(
      "bloggerConnectButton"
    );


  const status =
    document.getElementById(
      "bloggerStatusText"
    );


  button.disabled =
    true;


  status.innerHTML =
    `<span class="status-pill disconnected">준비 중</span>
     Google Blogger 권한 요청 생성 중...`;


  try {

    const data =
      await adminApi(
        "/oauth/blogger/start",
        {
          method: "POST"
        }
      );


    if (
      !data.authorizationUrl
    ) {

      throw new Error(
        "authorization_url_missing"
      );

    }


    /*
     * 팝업
     */
    const popup =
      window.open(
        data.authorizationUrl,
        "bloggerOAuthPopup",
        "width=620,height=760,left=200,top=80"
      );


    if (!popup) {

      throw new Error(
        "팝업이 차단되었습니다. 브라우저에서 팝업을 허용해주세요."
      );

    }


    status.innerHTML =
      `<span class="status-pill disconnected">승인 대기</span>
       Google 창에서 Blogger 권한을 허용해주세요.`;


  } catch (error) {

    console.error(
      error
    );


    status.innerHTML =
      `<span class="status-pill error">실패</span>
       ${escapeHtml(
         error.message
       )}`;


  } finally {

    button.disabled =
      false;

  }

}


/* =========================================
   OAuth Popup 완료 수신
========================================= */

window.addEventListener(
  "message",
  async event => {

    /*
     * 메시지를 Worker에서 보낸 것인지 확인
     */
    if (
      event.origin !==
      API_ORIGIN
    ) {

      return;

    }


    const data =
      event.data;


    if (
      !data ||
      data.type !==
      "blogger-oauth-result"
    ) {

      return;

    }


    const status =
      document.getElementById(
        "bloggerStatusText"
      );


    if (
      data.success
    ) {

      status.innerHTML =
        `<span class="status-pill connected">성공</span>
         Blogger 권한 저장 완료. 연결 상태 확인 중...`;


      setTimeout(
        checkBloggerStatus,
        500
      );


    } else {

      status.innerHTML =
        `<span class="status-pill error">실패</span>
         Blogger 권한 연결이 완료되지 않았습니다.`;

    }

  }
);


/* =========================================
   Blogger 연결 해제
========================================= */

async function disconnectBlogger() {

  const ok =
    confirm(
      "Blogger 수정 권한 연결을 해제할까요?\n\n블로그 글이 삭제되는 것은 아니며, 저장된 OAuth 연결만 제거됩니다."
    );


  if (!ok) {

    return;

  }


  try {

    await adminApi(
      "/oauth/blogger/disconnect",
      {
        method: "POST"
      }
    );


    BLOGGER_CONNECTED =
      false;


    await checkBloggerStatus();


  } catch (error) {

    alert(
      "연결 해제 실패: " +
      error.message
    );

  }

}


/* =========================================
   report.json
========================================= */

async function loadReport() {

  const response =
    await fetch(
      "./data/report.json?v=" +
      Date.now(),
      {
        cache:
          "no-store"
      }
    );


  if (!response.ok) {

    throw new Error(
      "report.json을 불러오지 못했습니다."
    );

  }


  REPORT =
    await response.json();


  const generatedAt =
    new Date(
      REPORT.generatedAt
    );


  document
    .getElementById(
      "updated"
    )
    .textContent =
      "마지막 검사: " +
      generatedAt
        .toLocaleString(
          "ko-KR"
        );


  let method =
    REPORT.recommendationMethod ||
    "";


  if (
    REPORT.modelVersion
  ) {

    method +=
      ` · 모델: ${REPORT.modelVersion}`;

  }


  document
    .getElementById(
      "method"
    )
    .textContent =
      method;


  renderBlogs();

  renderPosts();

}


/* =========================================
   카드
========================================= */

function renderBlogs() {

  const container =
    document.getElementById(
      "blogs"
    );


  container.innerHTML =
    REPORT.blogs
      .map(
        blog => {

          const tuning =
            blog.tuning ||
            {};


          const threshold =
            Math.round(
              Number(
                tuning.threshold ||
                0
              ) * 100
            );


          const single =
            Math.round(
              Number(
                tuning.singleEvidenceThreshold ||
                0
              ) * 100
            );


          const weak =
            Math.round(
              Number(
                tuning.weakEvidenceThreshold ||
                0
              ) * 100
            );


          const trusted =
            Number(
              tuning.trustedPositiveSamples ||
              0
            );


          const raw =
            Number(
              tuning.rawPositiveSamples ||
              0
            );


          const rejected =
            Number(
              tuning.rejectedPositiveSamples ||
              0
            );


          const labels =
            (blog.commonLabels || [])
              .map(
                item => `
                  <span class="common-label">
                    ${escapeHtml(
                      item.label
                    )}
                    ${number(
                      item.count
                    )}
                  </span>
                `
              )
              .join("");


          return `

            <div class="card">

              <h2>
                ${escapeHtml(
                  blog.name
                )}
              </h2>


              <a
                href="${safeUrl(
                  blog.url
                )}"
                target="_blank"
                rel="noopener noreferrer"
              >
                블로그 열기 ↗
              </a>


              <div class="numbers">

                <div class="number">

                  <strong>
                    ${number(
                      blog.totalPosts
                    )}
                  </strong>

                  <span>
                    게시글
                  </span>

                </div>


                <div class="number">

                  <strong>
                    ${number(
                      blog.warningPosts
                    )}
                  </strong>

                  <span>
                    경고 글
                  </span>

                </div>


                <div class="number">

                  <strong>
                    ${number(
                      blog.isolatedPosts
                    )}
                  </strong>

                  <span>
                    고립 글
                  </span>

                </div>


                <div class="number">

                  <strong>
                    ${number(
                      blog.recommendationPosts
                    )}
                  </strong>

                  <span>
                    추천 가능
                  </span>

                </div>

              </div>


              <div class="tuning-info">

                <div>
                  🎯 자동 기준
                  <strong>
                    ${threshold}%
                  </strong>
                </div>

                <div>
                  1️⃣ 단일 근거
                  <strong>
                    ${single}%
                  </strong>
                </div>

                <div>
                  0️⃣ 약한 관계
                  <strong>
                    ${weak}%
                  </strong>
                </div>

                <div>

                  🧠 신뢰 학습

                  <strong>
                    ${trusted} / ${raw}
                  </strong>

                  · 제외
                  ${rejected}

                </div>

                ${
                  labels
                    ? `
                      <div style="margin-top:7px">
                        흔한 라벨<br>
                        ${labels}
                      </div>
                    `
                    : ""
                }

              </div>

            </div>

          `;

        }
      )
      .join("");

}


/* =========================================
   Posts
========================================= */

function allPosts() {

  if (
    !REPORT ||
    !Array.isArray(
      REPORT.blogs
    )
  ) {

    return [];

  }


  return REPORT.blogs
    .flatMap(
      blog =>
        (blog.posts || [])
          .map(
            post => ({
              ...post,
              blogName:
                blog.name
            })
          )
    );

}


/* =========================================
   Filter
========================================= */

function matchesFilter(
  post
) {

  const warnings =
    post.warnings ||
    [];


  const recommendations =
    post.recommendations ||
    [];


  if (
    FILTER === "warning"
  ) {

    return warnings.length > 0;

  }


  if (
    FILTER === "isolated"
  ) {

    return (
      Number(
        post.incomingLinks ||
        0
      ) === 0
    );

  }


  if (
    FILTER === "internal"
  ) {

    return (
      Number(
        post.internalLinks ||
        0
      ) === 0
    );

  }


  if (
    FILTER === "recommended"
  ) {

    return (
      recommendations.length > 0
    );

  }


  if (
    FILTER === "short"
  ) {

    return warnings.includes(
      "본문 짧음"
    );

  }


  if (
    FILTER === "h2"
  ) {

    return warnings.includes(
      "H2 없음"
    );

  }


  return true;

}


/* =========================================
   Table
========================================= */

function renderPosts() {

  const all =
    allPosts();


  const posts =
    all
      .filter(
        matchesFilter
      )
      .sort(
        (a, b) =>
          new Date(
            b.updated ||
            b.published ||
            0
          ) -
          new Date(
            a.updated ||
            a.published ||
            0
          )
      );


  document
    .getElementById(
      "countLine"
    )
    .textContent =
      `표시 중: ${posts.length} / 전체 ${all.length}개 글`;


  const tbody =
    document.getElementById(
      "posts"
    );


  tbody.innerHTML =
    posts
      .map(
        post => {

          const warnings =
            post.warnings ||
            [];


          const recommendations =
            post.recommendations ||
            [];


          const incoming =
            Number(
              post.incomingLinks ||
              0
            );


          const outgoing =
            Number(
              post.internalLinks ||
              0
            );


          const warningHtml =
            warnings.length === 0

              ? `
                <span class="ok">
                  정상
                </span>
              `

              : warnings
                  .map(
                    warning => {

                      let cls =
                        "badge";


                      if (
                        warning ===
                        "고립 글"
                      ) {

                        cls +=
                          " isolated";

                      }


                      if (
                        warning ===
                        "제목 없음"
                      ) {

                        cls +=
                          " missing-title";

                      }


                      return `
                        <span class="${cls}">
                          ${escapeHtml(
                            warning
                          )}
                        </span>
                      `;

                    }
                  )
                  .join("");


          const recommendationHtml =
            recommendations.length === 0

              ? `
                <span class="muted">
                  추천 없음
                </span>
              `

              : recommendations
                  .map(
                    (
                      rec,
                      index
                    ) => {

                      const reasons =
                        (
                          rec.reasons ||
                          []
                        )
                          .map(
                            escapeHtml
                          )
                          .join(
                            " · "
                          );


                      return `

                        <a
                          class="recommendation"
                          href="${safeUrl(
                            rec.url
                          )}"
                          target="_blank"
                          rel="noopener noreferrer"
                        >

                          ${index + 1}.
                          ${escapeHtml(
                            rec.title
                          )}

                          <span class="score">

                            ${Math.round(
                              Number(
                                rec.score ||
                                0
                              ) * 100
                            )}%

                          </span>


                          ${
                            reasons
                              ? `
                                <span class="reason">
                                  ${reasons}
                                </span>
                              `
                              : ""
                          }

                        </a>

                      `;

                    }
                  )
                  .join("");


          return `

            <tr>

              <td>
                ${escapeHtml(
                  post.blogName
                )}
              </td>

              <td>

                <a
                  class="post-title"
                  href="${safeUrl(
                    post.url
                  )}"
                  target="_blank"
                  rel="noopener noreferrer"
                >

                  ${
                    post.title
                      ? escapeHtml(
                          post.title
                        )
                      : "(제목 없음)"
                  }

                </a>

              </td>

              <td>
                ${formatNumber(
                  post.textLength
                )}
              </td>

              <td
                class="${
                  outgoing === 0
                    ? "warn"
                    : ""
                }"
              >
                ${outgoing}
              </td>

              <td
                class="${
                  incoming === 0
                    ? "danger"
                    : ""
                }"
              >
                ${incoming}
              </td>

              <td>
                ${number(
                  post.externalLinks
                )}
              </td>

              <td>
                ${number(
                  post.images
                )}
              </td>

              <td
                class="${
                  Number(
                    post.h2 ||
                    0
                  ) === 0
                    ? "warn"
                    : ""
                }"
              >
                ${number(
                  post.h2
                )}
              </td>

              <td>
                ${warningHtml}
              </td>

              <td class="recommendations">
                ${recommendationHtml}
              </td>

            </tr>

          `;

        }
      )
      .join("");

}


/* =========================================
   Filter Change
========================================= */

function setFilter(
  filter
) {

  FILTER =
    filter;


  document
    .querySelectorAll(
      "#controls button"
    )
    .forEach(
      button => {

        button.classList.toggle(

          "active",

          button.dataset.filter ===
            filter

        );

      }
    );


  renderPosts();

}


/* =========================================
   Utility
========================================= */

function number(
  value
) {

  const n =
    Number(
      value
    );


  return Number.isFinite(
    n
  )
    ? n
    : 0;

}


function formatNumber(
  value
) {

  return number(
    value
  ).toLocaleString(
    "ko-KR"
  );

}


function safeUrl(
  value
) {

  try {

    const url =
      new URL(
        String(
          value
        )
      );


    if (
      url.protocol === "http:" ||
      url.protocol === "https:"
    ) {

      return escapeHtml(
        url.href
      );

    }

  } catch {}


  return "#";

}


function escapeHtml(
  value
) {

  return String(
    value ??
    ""
  )

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}
