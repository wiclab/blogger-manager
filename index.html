<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Blogger Manager</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f5f7fa;
      color: #1f2937;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans KR",
        sans-serif;
    }

    .wrap {
      width: min(1380px, calc(100% - 32px));
      margin: 36px auto;
    }

    h1 {
      margin: 0 0 6px;
    }

    .sub {
      margin: 0;
      color: #6b7280;
    }

    #updated,
    .method {
      color: #6b7280;
      font-size: 13px;
    }

    #updated {
      margin-top: 14px;
    }

    .method {
      margin-top: 6px;
    }

    .blogs {
      display: grid;
      grid-template-columns:
        repeat(
          auto-fit,
          minmax(280px, 1fr)
        );
      gap: 16px;
      margin: 26px 0;
    }

    .card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 20px;
      box-shadow:
        0 3px 12px
        rgba(0,0,0,.04);
    }

    .card h2 {
      margin: 0 0 10px;
    }

    .numbers {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      margin-top: 18px;
    }

    .number strong {
      display: block;
      font-size: 25px;
    }

    .number span {
      font-size: 12px;
      color: #6b7280;
    }

    .tuning-info {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid #eee;
      color: #6b7280;
      font-size: 12px;
      line-height: 1.7;
  }

  .tuning-info strong {
    color: #374151;
  }

  .common-label {
    display: inline-block;
    margin: 2px 3px 2px 0;
    padding: 2px 6px;
    border-radius: 999px;
    background: #f3f4f6;
    color: #4b5563;
  }

    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 22px 0 12px;
    }

    button {
      border: 1px solid #d1d5db;
      background: white;
      color: #1f2937;
      border-radius: 10px;
      padding: 9px 12px;
      cursor: pointer;
      font-weight: 600;
    }

    button:hover,
    button.active {
      background: #111827;
      color: white;
      border-color: #111827;
    }

    .count-line {
      font-size: 13px;
      color: #6b7280;
      margin: 0 0 10px;
    }

    .table-wrap {
      overflow-x: auto;
      background: white;
      border-radius: 14px;
      border: 1px solid #e5e7eb;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1180px;
    }

    th,
    td {
      padding: 11px 12px;
      border-bottom: 1px solid #eee;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #f9fafb;
      font-size: 12px;
      white-space: nowrap;
    }

    td {
      font-size: 13px;
    }

    tr:hover td {
      background: #fcfcfd;
    }

    a {
      color: #2563eb;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .title-link {
      font-weight: 600;
      line-height: 1.45;
    }

    .ok {
      color: #16803b;
      font-weight: 700;
    }

    .warn {
      color: #b45309;
      font-weight: 700;
    }

    .danger {
      color: #b91c1c;
      font-weight: 700;
    }

    .badge {
      display: inline-block;
      background: #fff7ed;
      color: #9a3412;
      border-radius: 999px;
      padding: 3px 7px;
      margin: 2px;
      font-size: 11px;
      white-space: nowrap;
    }

    .badge.isolated {
      background: #fef2f2;
      color: #b91c1c;
    }

    .recommendations {
      min-width: 245px;
      max-width: 330px;
    }

    .recommendation {
      display: block;
      margin-bottom: 6px;
      line-height: 1.35;
    }

    .recommendation:last-child {
      margin-bottom: 0;
    }

    .score {
      color: #9ca3af;
      font-size: 10px;
      margin-left: 4px;
    }

    .muted {
      color: #9ca3af;
    }

    @media (max-width: 700px) {
      .wrap {
        width: min(
          100% - 20px,
          1380px
        );
        margin: 22px auto;
      }

      h1 {
        font-size: 25px;
      }

      .card {
        padding: 16px;
      }
    }
  </style>
</head>

<body>

<div class="wrap">

  <h1>📊 Blogger Manager</h1>

  <p class="sub">
    별다알 + Nobody Asked Data 통합 점검
  </p>

  <div id="updated"></div>

  <div
    id="method"
    class="method">
  </div>

  <div
    id="blogs"
    class="blogs">
  </div>

  <div
    class="controls"
    id="controls">

    <button
      data-filter="all"
      class="active"
      onclick="setFilter('all')">
      전체 글
    </button>

    <button
      data-filter="warning"
      onclick="setFilter('warning')">
      ⚠ 경고 글
    </button>

    <button
      data-filter="isolated"
      onclick="setFilter('isolated')">
      🏝 고립 글
    </button>

    <button
      data-filter="internal"
      onclick="setFilter('internal')">
      나가는 내부링크 0
    </button>

    <button
      data-filter="recommended"
      onclick="setFilter('recommended')">
      🔗 추천 있음
    </button>

    <button
      data-filter="short"
      onclick="setFilter('short')">
      본문 짧음
    </button>

    <button
      data-filter="h2"
      onclick="setFilter('h2')">
      H2 없음
    </button>

  </div>

  <p
    id="countLine"
    class="count-line">
  </p>

  <div class="table-wrap">

    <table>

      <thead>
        <tr>
          <th>블로그</th>
          <th>글 제목</th>
          <th>글자수</th>
          <th>나가는 링크</th>
          <th>받는 링크</th>
          <th>외부링크</th>
          <th>이미지</th>
          <th>H2</th>
          <th>점검</th>
          <th>내부링크 추천</th>
        </tr>
      </thead>

      <tbody id="posts"></tbody>

    </table>

  </div>

</div>

<script>

let REPORT = null;
let FILTER = "all";

async function loadReport() {

  const response =
    await fetch(
      "./data/report.json?v=" +
      Date.now()
    );

  if (!response.ok) {
    throw new Error(
      "report.json을 불러오지 못했습니다."
    );
  }

  REPORT =
    await response.json();

  document
    .getElementById("updated")
    .textContent =
      "마지막 검사: " +
      new Date(
        REPORT.generatedAt
      ).toLocaleString("ko-KR");

  document
    .getElementById("method")
    .textContent =
      REPORT.recommendationMethod ||
      "추천은 같은 블로그 안의 제목·라벨·본문 유사도를 기준으로 계산합니다.";

  renderBlogs();
  renderPosts();
}

function renderBlogs() {
  const container =
    document.getElementById("blogs");

  container.innerHTML =
    REPORT.blogs.map(blog => {

      const tuning =
        blog.tuning || {};

      const threshold =
        Math.round(
          Number(
            tuning.threshold || 0
          ) * 100
        );

      const weakThreshold =
        Math.round(
          Number(
            tuning.weakEvidenceThreshold || 0
          ) * 100
        );

      const trusted =
        Number(
          tuning.trustedPositiveSamples || 0
        );

      const raw =
        Number(
          tuning.rawPositiveSamples || 0
        );

      const rejected =
        Number(
          tuning.rejectedPositiveSamples || 0
        );

      const commonLabels =
        (blog.commonLabels || [])
          .map(item => `
            <span class="common-label">
              ${escapeHtml(item.label)}
              ${item.count}
            </span>
          `)
          .join("");

      return `
        <div class="card">

          <h2>
            ${escapeHtml(blog.name)}
          </h2>

          <a
            href="${safeUrl(blog.url)}"
            target="_blank"
            rel="noopener">
            블로그 열기 ↗
          </a>

          <div class="numbers">

            <div class="number">
              <strong>${number(blog.totalPosts)}</strong>
              <span>게시글</span>
            </div>

            <div class="number">
              <strong>${number(blog.warningPosts)}</strong>
              <span>경고 글</span>
            </div>

            <div class="number">
              <strong>${number(blog.isolatedPosts)}</strong>
              <span>고립 글</span>
            </div>

            <div class="number">
              <strong>${number(blog.recommendationPosts)}</strong>
              <span>추천 가능</span>
            </div>

          </div>

          <div class="tuning-info">

            <div>
              🎯 자동 추천 기준
              <strong>${threshold}%</strong>
            </div>

            <div>
              🧹 약한 관계 기준
              <strong>${weakThreshold}%</strong>
            </div>

            <div>
              🧠 신뢰 학습
              <strong>${trusted} / ${raw}</strong>
              · 제외 ${rejected}
            </div>

            ${
              commonLabels
                ? `
                  <div style="margin-top:6px">
                    흔한 라벨<br>
                    ${commonLabels}
                  </div>
                `
                : ""
            }

          </div>

        </div>
      `;
    }).join("");
}

function allPosts() {

  return REPORT.blogs.flatMap(
    blog =>
      blog.posts.map(post => ({
        ...post,
        blogName: blog.name
      }))
  );
}

function matchesFilter(post) {

  const warnings =
    post.warnings || [];

  const recommendations =
    post.recommendations || [];

  const incomingLinks =
    Number(
      post.incomingLinks || 0
    );

  if (FILTER === "warning")
    return warnings.length > 0;

  if (FILTER === "isolated")
    return incomingLinks === 0;

  if (FILTER === "internal")
    return Number(
      post.internalLinks || 0
    ) === 0;

  if (FILTER === "recommended")
    return recommendations.length > 0;

  if (FILTER === "short")
    return warnings.includes(
      "본문 짧음"
    );

  if (FILTER === "h2")
    return warnings.includes(
      "H2 없음"
    );

  return true;
}

function renderPosts() {

  const all =
    allPosts();

  const posts =
    all
      .filter(matchesFilter)
      .sort(
        (a, b) =>
          new Date(b.updated) -
          new Date(a.updated)
      );

  document
    .getElementById("countLine")
    .textContent =
      `표시 중: ${posts.length} / 전체 ${all.length}개 글`;

  const tbody =
    document.getElementById(
      "posts"
    );

  tbody.innerHTML =
    posts.map(post => {

      const warnings =
        post.warnings || [];

      const recommendations =
        post.recommendations || [];

      const incomingLinks =
        Number(
          post.incomingLinks || 0
        );

      const warningHtml =
        warnings.length === 0
          ? `
            <span class="ok">
              정상
            </span>
          `
          : warnings.map(w => {

              const cls =
                w === "고립 글"
                  ? "badge isolated"
                  : "badge";

              return `
                <span class="${cls}">
                  ${escapeHtml(w)}
                </span>
              `;

            }).join("");

      const recommendationHtml =
        recommendations.length === 0
          ? `
            <span class="muted">
              추천 없음
            </span>
          `
          : recommendations
              .map(
                (rec, index) => `

                  <a
                    class="recommendation"
                    href="${safeUrl(rec.url)}"
                    target="_blank"
                    rel="noopener">

                    ${index + 1}.
                    ${escapeHtml(rec.title)}

                    <span class="score">
                      ${Math.round(
                        Number(
                          rec.score || 0
                        ) * 100
                      )}%
                    </span>

                  </a>

                `
              )
              .join("");

      return `

        <tr>

          <td>
            ${escapeHtml(
              post.blogName
            )}
          </td>

          <td>
            <a
              class="title-link"
              href="${safeUrl(post.url)}"
              target="_blank"
              rel="noopener">

              ${escapeHtml(
                post.title
              )}

            </a>
          </td>

          <td>
            ${number(
              post.textLength
            ).toLocaleString()}
          </td>

          <td
            class="${
              Number(
                post.internalLinks || 0
              ) === 0
                ? "warn"
                : ""
            }">

            ${number(
              post.internalLinks
            )}

          </td>

          <td
            class="${
              incomingLinks === 0
                ? "danger"
                : ""
            }">

            ${incomingLinks}

          </td>

          <td>
            ${number(
              post.externalLinks
            )}
          </td>

          <td>
            ${number(
              post.images
            )}
          </td>

          <td
            class="${
              Number(
                post.h2 || 0
              ) === 0
                ? "warn"
                : ""
            }">

            ${number(post.h2)}

          </td>

          <td>
            ${warningHtml}
          </td>

          <td class="recommendations">
            ${recommendationHtml}
          </td>

        </tr>

      `;

    }).join("");
}

function setFilter(filter) {

  FILTER = filter;

  document
    .querySelectorAll(
      "#controls button"
    )
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.filter === filter
      );

    });

  renderPosts();
}

function number(value) {

  const n =
    Number(value);

  return Number.isFinite(n)
    ? n
    : 0;
}

function safeUrl(value) {

  try {

    const url =
      new URL(
        String(value)
      );

    if (
      url.protocol === "http:" ||
      url.protocol === "https:"
    ) {

      return escapeHtml(
        url.href
      );

    }

  } catch {}

  return "#";
}

function escapeHtml(value) {

  return String(
    value ?? ""
  )
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );
}

loadReport().catch(error => {

  document.body.innerHTML =
    "<pre style='padding:30px'>" +
    escapeHtml(
      error.message
    ) +
    "</pre>";

});

</script>

</body>
</html>
